name: Deploy backoffice (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backoffice/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'scripts/cf-pages-stage.mjs'
      - '.github/workflows/deploy-backoffice.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler 4.131+ requires Node 22 (Pages Git wrangler 3.114.17 500s OpenNext).
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require Cloudflare Direct Upload credentials
        id: cf_auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Skipping Direct Upload; Pages Git deploy is used instead."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build OpenNext for Pages
        if: steps.cf_auth.outputs.skip != 'true'
        working-directory: apps/backoffice
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run cf:build
      - name: Deploy to Cloudflare Pages
        if: steps.cf_auth.outputs.skip != 'true'
        working-directory: apps/backoffice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .pages-dist --project-name=lobby --commit-dirty=true
