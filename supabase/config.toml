project_id = "mjzjracjadlybvdttgto"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "lobby"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:8081",
  "exp://127.0.0.1:8081",
  "lobby://**",
